[project]
name = "youtube-multiagent-downloader"
version = "0.1.0"
description = "Multi-Agent YouTube Search and MP3 Downloader built with Google ADK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk>=2.12.0",
    "google-genai>=2.30.0",
    "yt-dlp>=2026.0.0",
    "static-ffmpeg>=3.0.0",
    "python-dotenv>=1.2.0",
    "rich>=15.0.0",
    "pydantic>=2.14.0",
]

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["agents", "tools", "utils"]
